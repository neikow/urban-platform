{% if figures %}
    <dl class="grid grid-cols-2 gap-x-8 gap-y-10 {% if figures|length == 4 %}lg:grid-cols-4{% elif figures|length == 3 %}lg:grid-cols-3{% endif %}">
        {% for figure in figures %}
            <div class="flex flex-col-reverse border-t-2 border-current/15 pt-5">
                <dt class="home-muted mt-3 text-sm font-semibold uppercase tracking-label">{{ figure.label }}</dt>
                <dd class="home-accent font-display font-black text-display-lg leading-none">{{ figure.value }}</dd>
            </div>
        {% endfor %}
    </dl>
{% endif %}
