name: CI

on:
  pull_request:
  workflow_call:

jobs:
  # Job names are required status checks on main: keep them stable.
  lint:
    name: Quality (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Ruff and Bandit need no project dependencies: run the versions pinned
      # in uv.lock instead of syncing the whole environment.
      - name: Read pinned tool versions
        run: |
          uv export --only-dev --no-hashes > /tmp/dev-requirements.txt
          echo "RUFF=$(grep -oP '^ruff==\K[^ ;]+' /tmp/dev-requirements.txt)" >> "$GITHUB_ENV"
          echo "BANDIT=$(grep -oP '^bandit==\K[^ ;]+' /tmp/dev-requirements.txt)" >> "$GITHUB_ENV"

      - name: Run Ruff Linter
        run: uvx ruff@$RUFF check --output-format=github

      - name: Run Bandit Security Scan
        run: uvx --from "bandit[toml]==$BANDIT" bandit -c pyproject.toml -r core home about legal pedagogy publications urban_platform scripts agent/urban_agent

  format:
    name: Quality (format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Ruff Formatter
        run: uvx ruff@$(uv export --only-dev --no-hashes | grep -oP '^ruff==\K[^ ;]+') format --check

  types:
    name: Quality (types)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: urban_platform.settings.test
      SECRET_KEY: "test-key"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Mypy Type Checker
        run: uv run mypy .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Test the theme (frontend/theme)
        run: npm test

      - name: Build front-end assets
        run: npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tests: [ unit, e2e ]

    env:
      DJANGO_SETTINGS_MODULE: urban_platform.settings.test
      SECRET_KEY: "test-key"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Unit Tests
        if: matrix.tests == 'unit'
        run: uv run pytest --ignore e2e -n auto --junitxml=test-results-unit.xml --cov --cov-report=xml:coverage.xml

      - name: Upload Unit Test Results
        if: matrix.tests == 'unit' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: test-results-unit.xml

      - name: Coverage comment
        if: matrix.tests == 'unit'
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store Pull Request comment to be posted
        if: matrix.tests == 'unit' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        id: coverage_comment_store
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

      - name: Install system dependencies
        if: matrix.tests == 'e2e'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Set up Node
        if: matrix.tests == 'e2e'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Build front-end assets
        if: matrix.tests == 'e2e'
        run: npm ci && npm run build

      - name: Install Playwright browsers
        if: matrix.tests == 'e2e'
        run: |
          uv run playwright install --with-deps chromium

      - name: Run End-to-End Tests
        if: matrix.tests == 'e2e'
        run: uv run scripts/e2e.py ci

      - name: Upload Playwright Artifacts
        if: matrix.tests == 'e2e' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            e2e-server.log
