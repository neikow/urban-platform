[project]
name = "urban-platform"
version = "0.1.0"
description = "Civic participation platform for Marseille's 7th arrondissement (Django + Wagtail)"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]==5.6.3",
    "django==6.0.3",
    "django-celery-beat==2.9.0",
    "django-ratelimit==4.1.0",
    "django-stubs-ext==6.1.2",
    "gunicorn==26.2.0",
    "psycopg==3.3.6",
    "python-dotenv==1.2.4",
    "python-slugify==8.0.4",
    "redis==8.1.0",
    "sentry-sdk==2.71.0",
    "sib-api-v3-sdk==7.6.0",
    "tqdm==4.70.1",
    "wagtail==8.0",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main"
]
strict_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "wagtail.*",
    "modelcluster.*",
    "django_ratelimit.*",
    "django_celery_beat.*",
    "amqp.*",
    "django_filters.*",
    "modelsearch.*",
    "taggit.*",
    "treebeard.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "urban_platform.settings.dev"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "celery-stubs>=0.1.3",
    "django-browser-reload>=1.21.0",
    "django-stubs[compatible-mypy]>=5.2.8",
    "factory-boy>=3.3.3",
    "mkdocs-material>=9.7.6",
    "mypy>=1.19.1",
    "playwright>=1.57.0",
    "pre-commit==4.6.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "pytest-env>=1.2.0",
    "pytest-playwright>=0.7.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "urban_platform.settings.test"
addopts = "--strict-markers --tb=short -m 'not e2e'"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# The deployment agent is its own package, outside the Django project.
pythonpath = ["agent"]
markers = [
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
]

[tool.coverage.run]
relative_files = true
branch = true
source = [
    "about",
    "core",
    "home",
    "legal",
    "pedagogy",
    "publications",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/factories/*",
    "*/factories.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# Ruff's pre-0.16 default rule set, pinned so upgrading ruff does not change
# what CI enforces. Widening it (isort, pyupgrade, RUF...) is a separate change.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401" # use explicit re-export
]

[tool.ruff.lint.per-file-ignores]
"urban_platform/settings/*" = ["F403", "F405"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
