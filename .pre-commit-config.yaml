default_install_hook_types: [ pre-commit, post-checkout, pre-push ]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/UnknownPlatypus/djangofmt-pre-commit
    rev: v0.2.5
    hooks:
      - id: djangofmt
        exclude: robots\.txt$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [ "-c", "pyproject.toml" ]
        additional_dependencies: [ "bandit[toml]" ]
  - repo: local
    hooks:
      # Ruff runs from the project environment so hooks and CI use the
      # version pinned in uv.lock.
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [ python, pyi ]
      - id: sync-uv-packages
        name: Sync UV Packages
        entry: uv sync
        language: system
        pass_filenames: false
        always_run: true
        stages: [ post-checkout ]
      - id: mypy
        name: Run MyPy
        entry: uv run mypy .
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-push ]
      - id: run-tailwindcss-build
        name: Run TailwindCSS Build
        entry: npm run styles:build
        pass_filenames: false
        always_run: true
        language: system
        stages: [ post-checkout ]
