# The host's edge proxy: one Traefik routing each website's hostname to its
# nginx (labels in deploy/tenant/compose.yml), with Let's Encrypt certificates.
# Started by the agent as the "urban-edge" project.

services:
    traefik:
        image: traefik:v3.6
        restart: unless-stopped
        command:
            - --providers.docker=true
            # Only containers labelled traefik.enable=true (the websites' nginx).
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=${EDGE_NETWORK:-urban-edge}
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set acme_email in the control plane}
            - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
            - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
            - --ping=true
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - certificates:/certificates
        networks:
            - edge
        healthcheck:
            test: ["CMD", "traefik", "healthcheck", "--ping"]
            interval: 30s
            timeout: 5s
            retries: 3

volumes:
    certificates:

networks:
    edge:
        name: ${EDGE_NETWORK:-urban-edge}
        external: true
