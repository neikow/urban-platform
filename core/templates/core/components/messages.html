{% load i18n %}

{% if messages %}
    <div
        class="fixed top-20 inset-x-4 sm:inset-x-auto sm:right-6 z-40 flex flex-col gap-2 sm:w-96"
        role="status"
        aria-live="polite"
    >
        {% for message in messages %}
            <div
                data-dismissible
                class="alert shadow-lg {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %}"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="stroke-current shrink-0 h-6 w-6"
                    fill="none"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    {% if message.tags == 'success' %}
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                        />
                    {% elif message.tags == 'error' %}
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
                        />
                    {% else %}
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                        />
                    {% endif %}
                </svg>
                <span>{{ message }}</span>
                <button
                    type="button"
                    class="btn btn-ghost btn-xs btn-square"
                    aria-label="{% trans 'Close' %}"
                    data-dismiss
                >
                    ✕
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
